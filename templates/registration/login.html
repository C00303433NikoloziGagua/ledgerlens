{% extends 'base.html' %}

{% block title %}Log in · LedgerLens{% endblock %}

{% block content %}
  <article>
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Log in</button>
    </form>
    <p>No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
  </article>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Upload · LedgerLens{% endblock %}

{% block content %}
  <article>
    <h1>Upload an invoice</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">Upload</button>
    </form>
    <small>Processing can take up to a minute.</small>
  </article>
{% endblock %}
